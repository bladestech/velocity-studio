name: Linux packages

# Builds the Linux packages with scripts/build-linux.sh on a real Ubuntu runner.
# Run it by hand (Actions -> Linux packages -> Run workflow) or push a v* tag.
# The packages are uploaded as a workflow artifact; they are not attached to a release automatically.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage, deb, rpm, pacman and tar.gz
        run: bash scripts/build-linux.sh --yes --targets all

      - name: Check the packages
        run: |
          set -euo pipefail
          ls -l dist
          dpkg-deb --info dist/*.deb
          rpm -qp --info dist/*.rpm
          # The app binary and the sandbox helper must keep their executable bits.
          mkdir "$RUNNER_TEMP/t" && tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/t"
          test -x "$RUNNER_TEMP"/t/velocity-studio-*/velocity-studio
          chmod +x dist/*.AppImage
          dist/*.AppImage --appimage-extract-and-run --no-sandbox --version

      - uses: actions/upload-artifact@v4
        with:
          name: velocity-studio-linux-x64
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
